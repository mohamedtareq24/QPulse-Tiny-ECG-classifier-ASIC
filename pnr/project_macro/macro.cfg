# Macro placement for project_macro
#
# Format: <instance_name> <x> <y> <orientation>
#   x, y   : lower-left corner of the macro bounding box, in µm (die-absolute)
#   orient : N = default (no rotation)
#
# ADC macro: tt_um_TT06_SAR_wulffern — 161.0 × 225.76 µm
#   Footprint: x=[6.0, 167.0]  y=[794.0, 1019.76]
#   Analog ua pins: bottom edge (y=794) — face toward die interior
#   Signal pins:    top edge   (y=1019.76) — face toward die top (gpio_top)
#   Power pins:     met4 left (VPWR x≈7.75) and right (VGND x≈162.75)
#                   → ring left verticals fall outside core left boundary → clipped
#
# Routing obstructions on met1-met4 over the macro footprint are set in
# config.json ROUTING_OBSTRUCTIONS to protect the macro interior.
#
u_adc 80 750 N
